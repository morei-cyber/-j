<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Migi FBX Tutorial Viewer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#090c11;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#ui{
  position:fixed;left:12px;right:12px;top:12px;z-index:20;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px;
  border:1px solid #2e3745;
  border-radius:14px;
  background:rgba(8,11,16,.86);
  backdrop-filter:blur(10px)
}
button{
  font:inherit;
  border:1px solid #3c4655;
  background:#1a222d;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  font-weight:700
}
button.active{background:#3478f6;border-color:#3478f6}
button:disabled{opacity:.45}

#status{
  flex:1;
  min-width:260px;
  font-size:13px;
  color:#c8d0da
}

#details{
  position:fixed;
  left:12px;right:12px;bottom:12px;
  z-index:20;
  max-width:900px;
  max-height:35vh;
  overflow:auto;
  white-space:pre-wrap;
  padding:10px 12px;
  border:1px solid #2e3745;
  border-radius:12px;
  background:rgba(8,11,16,.84);
  color:#aeb8c4;
  font-size:11px;
  line-height:1.45
}
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <button data-index="0">右ストレート</button>
  <button data-index="1">右フック</button>
  <button data-index="2">左ストレート</button>
  <button data-index="3">左フック</button>
  <button id="replay">↻ 再生し直す</button>
  <button id="fit">中央に合わせる</button>
  <div id="status">FBXを読み込み中…</div>
</div>

<div id="details">起動中…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const app=document.getElementById("app");
const statusEl=document.getElementById("status");
const detailsEl=document.getElementById("details");
const replayEl=document.getElementById("replay");
const fitEl=document.getElementById("fit");
const buttons=[...document.querySelectorAll("#ui button[data-index]")];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c11);

const camera=new THREE.PerspectiveCamera(
  40,
  innerWidth/innerHeight,
  0.01,
  1000
);
camera.position.set(0,1.2,3.2);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setSize(innerWidth,innerHeight,false);
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x394350,2.4));

const l1=new THREE.DirectionalLight(0xffffff,3.2);
l1.position.set(3,5,4);
scene.add(l1);

const l2=new THREE.DirectionalLight(0x7fa7ff,1.5);
l2.position.set(-4,3,1);
scene.add(l2);

const l3=new THREE.DirectionalLight(0xffd6ad,1.0);
l3.position.set(0,2,-4);
scene.add(l3);

const grid=new THREE.GridHelper(10,20,0x303845,0x1a2029);
grid.position.y=-1.02;
scene.add(grid);

const loader=new FBXLoader();

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.minDistance=.25;
controls.maxDistance=30;
controls.target.set(0,0,0);

const FILES=[
  "Migi_straight.fbx",
  "Migi_hook.fbx",
  "Hidari_staright.fbx",
  "Hidari_hook.fbx"
];

const FALLBACKS=[
  [],
  [],
  ["Hidari_straight.fbx"],
  []
];

let model=null;
let mixer=null;
let action=null;
let currentClip=null;
let currentIndex=-1;

const clock=new THREE.Clock();

function log(msg,kind="INFO"){
  const line=`[${new Date().toLocaleTimeString()}][${kind}] ${msg}`;
  console.log(line);
  detailsEl.textContent=(line+"\n"+detailsEl.textContent).slice(0,16000);
}

function status(msg,ok=false){
  statusEl.textContent=msg;
  statusEl.style.color=ok?"#7df0ad":"#c8d0da";
}

function cleanupModel(){
  if(mixer){
    mixer.stopAllAction();
  }

  mixer=null;
  action=null;
  currentClip=null;

  if(!model)return;

  scene.remove(model);

  model.traverse(o=>{
    o.geometry?.dispose?.();

    if(o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];

      for(const m of mats){
        if(!m)continue;

        for(const v of Object.values(m)){
          if(v?.isTexture)v.dispose?.();
        }

        m.dispose?.();
      }
    }
  });

  model=null;
}

function makeVisible(root){
  root.traverse(o=>{
    if(!o.isMesh)return;

    o.visible=true;
    o.frustumCulled=false;

    const mats=Array.isArray(o.material)?o.material:[o.material];

    for(const m of mats){
      if(!m)continue;

      m.side=THREE.DoubleSide;
      m.transparent=false;
      m.opacity=1;
      m.depthWrite=true;
      m.needsUpdate=true;
    }
  });
}

function fitModel(root){
  root.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(root);

  if(box.isEmpty()){
    throw new Error("FBXのBoundsが空です。");
  }

  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);

  root.scale.setScalar(2.0/Math.max(maxDim,0.0001));
  root.updateMatrixWorld(true);

  const b=new THREE.Box3().setFromObject(root);
  const c=b.getCenter(new THREE.Vector3());
  const s=b.getSize(new THREE.Vector3());

  root.position.sub(c);
  root.updateMatrixWorld(true);

  const b2=new THREE.Box3().setFromObject(root);
  root.position.y+=-b2.min.y+0.02;
  root.updateMatrixWorld(true);

  const finalBox=new THREE.Box3().setFromObject(root);
  const fc=finalBox.getCenter(new THREE.Vector3());
  const fs=finalBox.getSize(new THREE.Vector3());

  const radius=Math.max(fs.x,fs.y,fs.z)*0.6;

  controls.target.copy(fc);

  camera.position.set(
    fc.x+radius*.1,
    fc.y+radius*.45,
    fc.z+radius*2.8
  );

  camera.lookAt(fc);
  controls.update();

  log(
    `fit: size=[${fs.x.toFixed(3)},${fs.y.toFixed(3)},${fs.z.toFixed(3)}] center=[${fc.x.toFixed(3)},${fc.y.toFixed(3)},${fc.z.toFixed(3)}]`,
    "OK"
  );
}

function summarize(root){
  let meshes=0;
  let bones=0;
  let skinned=0;
  let materials=0;

  root.traverse(o=>{
    if(o.isMesh)meshes++;
    if(o.isBone)bones++;
    if(o.isSkinnedMesh)skinned++;
    if(o.material){
      materials+=Array.isArray(o.material)?o.material.length:1;
    }
  });

  return `meshes=${meshes} bones=${bones} skinned=${skinned} materials=${materials} animations=${root.animations?.length||0}`;
}

async function readFBX(fileName){
  const response=await fetch("./"+fileName,{
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error(`HTTP ${response.status}: ${fileName}`);
  }

  const buffer=await response.arrayBuffer();

  if(buffer.byteLength<16){
    throw new Error(`ファイルが小さすぎます: ${fileName}`);
  }

  log(
    `${fileName}: bytes=${buffer.byteLength.toLocaleString()}`,
    "INFO"
  );

  return buffer;
}

async function loadIndex(index){
  currentIndex=index;

  buttons.forEach((b,i)=>{
    b.classList.toggle("active",i===index);
  });

  cleanupModel();

  let actualFile=FILES[index];
  status(`${actualFile} を読み込み中…`);

  try{
    let buffer;

    try{
      buffer=await readFBX(actualFile);
    }catch(firstError){
      const fb=FALLBACKS[index]?.[0];

      if(!fb){
        throw firstError;
      }

      log(`${actualFile} 取得失敗。代替名を試します: ${fb}`,"INFO");

      actualFile=fb;
      buffer=await readFBX(actualFile);
    }

    // ここが動作確認済みViewerと同じ読み込み方式。
    const obj=loader.parse(buffer.slice(0),"");

    cleanupModel();

    model=obj;

    makeVisible(model);
    scene.add(model);

    log(`${actualFile}: ${summarize(model)}`,"OK");

    // モデル表示を先に確定
    fitModel(model);

    // アニメーションを再生
    if(model.animations?.length){
      mixer=new THREE.AnimationMixer(model);
      currentClip=model.animations[0];

      action=mixer.clipAction(currentClip);
      action.reset().play();

      status(
        `${actualFile} / 読み込み成功 / 表示OK / 再生中`,
        true
      );

      log(
        `animation[0]: ${currentClip.name||"Animation 0"} duration=${currentClip.duration.toFixed(3)}s`,
        "OK"
      );
    }else{
      status(
        `${actualFile} / 読み込み成功 / 表示OK / アニメーションなし`,
        true
      );

      log("アニメーションなし","INFO");
    }

    replayEl.disabled=!mixer;
    fitEl.disabled=!model;

  }catch(err){
    cleanupModel();

    const msg=err?.stack||err?.message||String(err);

    status(`${actualFile} / 読み込み失敗`,false);
    log(msg,"ERROR");

    replayEl.disabled=true;
    fitEl.disabled=true;
  }
}

buttons.forEach((b,i)=>{
  b.addEventListener("click",()=>loadIndex(i));
});

replayEl.addEventListener("click",()=>{
  if(!mixer||!currentClip)return;

  mixer.stopAllAction();

  action=mixer.clipAction(currentClip);
  action.reset().play();

  log(
    `再生し直し: ${currentClip.name||"Animation 0"}`,
    "OK"
  );
});

fitEl.addEventListener("click",()=>{
  if(model)fitModel(model);
});

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});

renderer.domElement.addEventListener("webglcontextlost",e=>{
  e.preventDefault();
  log("WebGL context lost","ERROR");
});

renderer.domElement.addEventListener("webglcontextrestored",()=>{
  log("WebGL context restored","OK");
});

function animate(){
  requestAnimationFrame(animate);

  mixer?.update(clock.getDelta());
  controls.update();
  renderer.render(scene,camera);
}

animate();

log("起動完了。","OK");
log("同じフォルダのFBXをfetch → ArrayBuffer → FBXLoader.parse()します。","OK");

// 最初から右ストレートを表示
loadIndex(0);
</script>
</body>
</html>
