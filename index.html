<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FBX Tutorial Simple Viewer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c11;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#ui{
  position:fixed;left:12px;right:12px;top:12px;z-index:10;
  padding:10px;border:1px solid #2e3745;border-radius:14px;
  background:rgba(8,11,16,.88);backdrop-filter:blur(10px)
}
#buttons{display:flex;flex-wrap:wrap;gap:8px}
button{
  border:1px solid #3c4655;background:#1a222d;color:#fff;
  border-radius:10px;padding:9px 12px;font-weight:700
}
button.active{background:#3478f6;border-color:#3478f6}
#status{margin-top:9px;font-size:13px;color:#c8d0da}
#log{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:10;
  max-height:28vh;overflow:auto;white-space:pre-wrap;
  padding:10px 12px;border:1px solid #2e3745;border-radius:12px;
  background:rgba(8,11,16,.84);color:#aeb8c4;font-size:11px;line-height:1.45
}
</style>
</head>
<body>

<div id="app"></div>

<div id="ui">
  <div id="buttons"></div>
  <div id="status">FBXを読み込みます…</div>
</div>

<div id="log">起動中…</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const app=document.getElementById("app");
const buttonsEl=document.getElementById("buttons");
const statusEl=document.getElementById("status");
const logEl=document.getElementById("log");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c11);

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.01,1000);
camera.position.set(0,1.2,3.2);

const renderer=new THREE.WebGLRenderer({
  canvas:document.createElement("canvas"),
  antialias:true,
  alpha:false,
  powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setSize(innerWidth,innerHeight,false);
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x394350,2.4));

const l1=new THREE.DirectionalLight(0xffffff,3.2);
l1.position.set(3,5,4);
scene.add(l1);

const l2=new THREE.DirectionalLight(0x7fa7ff,1.5);
l2.position.set(-4,3,1);
scene.add(l2);

const l3=new THREE.DirectionalLight(0xffd6ad,1.0);
l3.position.set(0,2,-4);
scene.add(l3);

const grid=new THREE.GridHelper(10,20,0x303845,0x1a2029);
grid.position.y=-1.02;
scene.add(grid);

const loader=new FBXLoader();

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.minDistance=.25;
controls.maxDistance=30;
controls.target.set(0,0,0);

const FILES=[
  {name:"右ストレート",file:"Migi_straight.fbx"},
  {name:"右フック",file:"Migi_hook.fbx"},
  {name:"左ストレート",file:"Hidari_staright.fbx",fallback:"Hidari_straight.fbx"},
  {name:"左フック",file:"Hidari_hook.fbx"}
];

let model=null;
let mixer=null;
let clip=null;
let loadedIndex=-1;
const clock=new THREE.Clock();

function log(msg){
  const line=`[${new Date().toLocaleTimeString()}] ${msg}`;
  console.log(line);
  logEl.textContent=line+"\n"+logEl.textContent;
}

function status(msg,ok=false){
  statusEl.textContent=msg;
  statusEl.style.color=ok?"#7df0ad":"#c8d0da";
}

function cleanup(){
  if(mixer){
    mixer.stopAllAction();
    mixer=null;
  }
  clip=null;

  if(!model)return;

  scene.remove(model);

  model.traverse(o=>{
    if(o.geometry)o.geometry.dispose?.();
    if(o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{
        if(!m)return;
        for(const v of Object.values(m)){
          if(v?.isTexture)v.dispose?.();
        }
        m.dispose?.();
      });
    }
  });

  model=null;
}

function makeVisible(root){
  root.visible=true;

  root.traverse(o=>{
    if(!o.isMesh)return;

    o.visible=true;
    o.frustumCulled=false;

    const mats=Array.isArray(o.material)?o.material:[o.material];

    for(const m of mats){
      if(!m)continue;
      m.side=THREE.DoubleSide;
      m.transparent=false;
      m.opacity=1;
      m.depthWrite=true;
      m.needsUpdate=true;
    }
  });
}

function fitModel(root){
  root.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(root);

  if(box.isEmpty()){
    throw new Error("FBXのBoundsが空です。");
  }

  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);

  if(!Number.isFinite(maxDim)||maxDim<=0){
    throw new Error("FBXのサイズを取得できません。");
  }

  root.scale.setScalar(2/maxDim);
  root.updateMatrixWorld(true);

  const b=new THREE.Box3().setFromObject(root);
  const center=b.getCenter(new THREE.Vector3());

  root.position.sub(center);
  root.updateMatrixWorld(true);

  const b2=new THREE.Box3().setFromObject(root);
  root.position.y+=-b2.min.y+0.02;
  root.updateMatrixWorld(true);

  const finalBox=new THREE.Box3().setFromObject(root);
  const c=finalBox.getCenter(new THREE.Vector3());
  const s=finalBox.getSize(new THREE.Vector3());
  const radius=Math.max(s.x,s.y,s.z)*0.6;

  controls.target.copy(c);

  camera.position.set(
    c.x+radius*.1,
    c.y+radius*.45,
    c.z+radius*2.8
  );

  camera.lookAt(c);
  controls.update();
}

function prepareModel(root){
  makeVisible(root);

  root.traverse(o=>{
    if(!o.isMesh)return;

    o.castShadow=true;
    o.receiveShadow=true;

    const mats=Array.isArray(o.material)?o.material:[o.material];

    o.material=mats.map(m=>{
      if(!m){
        return new THREE.MeshStandardMaterial({
          color:0xd7deea,
          roughness:.72,
          metalness:.05,
          side:THREE.DoubleSide
        });
      }

      const color=(m.color?.isColor)
        ?m.color.clone()
        :new THREE.Color(0xd7deea);

      if(color.r+color.g+color.b<.1){
        color.setHex(0xaeb9c9);
      }

      return new THREE.MeshStandardMaterial({
        color,
        map:m.map||null,
        roughness:typeof m.roughness==="number"?Math.max(.45,Math.min(1,m.roughness)):.72,
        metalness:typeof m.metalness==="number"?Math.min(.2,m.metalness):.03,
        transparent:false,
        opacity:1,
        side:THREE.DoubleSide
      });
    });

    o.frustumCulled=false;
  });
}

async function fetchArrayBuffer(fileName){
  const url="./"+encodeURIComponent(fileName).replace(/%2F/g,"/");

  log(`fetch開始: ${url}`);

  const response=await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error(`HTTP ${response.status} ${response.statusText} / ${url}`);
  }

  const buffer=await response.arrayBuffer();

  log(`ArrayBuffer取得: ${buffer.byteLength.toLocaleString()} bytes`);

  if(buffer.byteLength<16){
    throw new Error("FBXファイルが小さすぎます。");
  }

  return buffer;
}

async function loadFBX(index){
  index=Math.max(0,Math.min(FILES.length-1,index));
  const item=FILES[index];

  loadedIndex=index;

  [...buttonsEl.children].forEach((b,i)=>{
    b.classList.toggle("active",i===index);
  });

  cleanup();

  status(`${item.file} を読み込み中…`);
  log(`=== ${item.name} / ${item.file} ===`);

  let buffer=null;
  let actualFile=item.file;

  try{
    buffer=await fetchArrayBuffer(item.file);
  }catch(firstError){
    log("最初のファイル取得失敗: "+firstError.message);

    if(item.fallback){
      log(`代替ファイルを試します: ${item.fallback}`);
      buffer=await fetchArrayBuffer(item.fallback);
      actualFile=item.fallback;
    }else{
      throw firstError;
    }
  }

  // 動作確認できたViewerと同じ方式:
  // File/URLそのものをFBXLoaderに渡さずArrayBufferをparseする。
  log("FBXLoader.parse() 開始");

  const obj=loader.parse(buffer.slice(0),"");

  log(`parse OK / meshes=${countType(obj,"mesh")} bones=${countType(obj,"bone")} skinned=${countType(obj,"skinned")}`);

  prepareModel(obj);
  scene.add(obj);

  model=obj;

  fitModel(model);

  if(Array.isArray(model.animations)&&model.animations.length){
    mixer=new THREE.AnimationMixer(model);
    clip=model.animations[0];

    const action=mixer.clipAction(clip);
    action.reset();
    action.setLoop(THREE.LoopRepeat,Infinity);
    action.play();

    status(`${actualFile} / 表示OK / 再生中`,true);
    log(`アニメーション再生: ${clip.name||"Animation 0"}`);
  }else{
    status(`${actualFile} / 表示OK / アニメーションなし`,true);
    log("アニメーションはありません。");
  }
}

function countType(root,type){
  let n=0;
  root.traverse(o=>{
    if(
      (type==="mesh"&&o.isMesh)||
      (type==="bone"&&o.isBone)||
      (type==="skinned"&&o.isSkinnedMesh)
    )n++;
  });
  return n;
}

for(let i=0;i<FILES.length;i++){
  const b=document.createElement("button");
  b.textContent=FILES[i].name;
  b.addEventListener("click",()=>loadFBX(i));
  buttonsEl.appendChild(b);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});

renderer.domElement.addEventListener("webglcontextlost",e=>{
  e.preventDefault();
  log("WebGL context lost");
});

renderer.domElement.addEventListener("webglcontextrestored",()=>{
  log("WebGL context restored");
});

function animate(){
  requestAnimationFrame(animate);
  mixer?.update(clock.getDelta());
  controls.update();
  renderer.render(scene,camera);
}

animate();

log("起動完了");
log("同じフォルダのFBXを自動読み込みします。");

// 起動時に右ストレートを自動表示
loadFBX(0).catch(e=>{
  console.error(e);
  status("右ストレートの読み込みに失敗");
  log("ERROR: "+(e?.stack||e?.message||String(e)));
});
</script>
</body>
</html>
