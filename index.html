<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FBX表示テスト</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#three{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:16px;top:16px;z-index:10;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:1.5;backdrop-filter:blur(8px)}
#hud b{font-size:16px}
#err{color:#ff8b8b;white-space:pre-wrap;max-width:min(90vw,700px)}
</style>
</head>
<body>
<div id="wrap"><div id="three"></div></div>
<div id="hud"><b>FBX表示テスト</b><div id="status">読み込み中…</div><div id="err"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { FBXLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js';

const mount=document.getElementById('three');
const statusEl=document.getElementById('status');
const errEl=document.getElementById('err');
let mixer=null, model=null;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(mount.clientWidth,mount.clientHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x20242b,1);
mount.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x20242b);

const camera=new THREE.PerspectiveCamera(35,1,0.01,1000);
camera.position.set(0,1.1,3.4);
camera.lookAt(0,0.9,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.8); key.position.set(3,5,4); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1.4); fill.position.set(-3,3,2); scene.add(fill);

const grid=new THREE.GridHelper(8,16,0x555555,0x333333); grid.position.y=0; scene.add(grid);

function fitModel(obj){
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z,0.001);

  const targetHeight=2.0;
  const scale=targetHeight/Math.max(size.y,0.001);
  obj.scale.multiplyScalar(scale);
  obj.updateMatrixWorld(true);

  const box2=new THREE.Box3().setFromObject(obj);
  const center2=box2.getCenter(new THREE.Vector3());
  obj.position.x-=center2.x;
  obj.position.z-=center2.z;
  obj.position.y-=box2.min.y;
  obj.rotation.y=Math.PI;
  obj.updateMatrixWorld(true);

  const finalBox=new THREE.Box3().setFromObject(obj);
  const finalSize=finalBox.getSize(new THREE.Vector3());
  const finalCenter=finalBox.getCenter(new THREE.Vector3());
  const distance=(finalSize.y/2)/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*1.5;
  camera.position.set(0, finalSize.y*0.55, Math.max(2.2,distance));
  camera.lookAt(finalCenter.x, finalCenter.y*0.95, finalCenter.z);
  camera.near=Math.max(0.01,finalSize.y/100);
  camera.far=Math.max(100,finalSize.y*20);
  camera.updateProjectionMatrix();
}

const loader=new FBXLoader();
loader.load(
  './Migi_straight.fbx',
  (fbx)=>{
    model=fbx;
    model.traverse(o=>{
      if(o.isMesh){
        o.visible=true;
        o.frustumCulled=false;
        if(o.material){
          const mats=Array.isArray(o.material)?o.material:[o.material];
          mats.forEach(m=>{m.side=THREE.DoubleSide; m.needsUpdate=true;});
        }
      }
    });
    scene.add(model);
    fitModel(model);
    if(fbx.animations&&fbx.animations.length){
      mixer=new THREE.AnimationMixer(model);
      mixer.clipAction(fbx.animations[0]).play();
      statusEl.textContent=`読み込み成功 / animation=${fbx.animations.length}`;
    }else{
      statusEl.textContent='読み込み成功 / animation=0';
    }
  },
  (xhr)=>{
    if(xhr.total){statusEl.textContent=`読み込み中… ${Math.round(xhr.loaded/xhr.total*100)}%`;}
  },
  (err)=>{
    console.error(err);
    statusEl.textContent='FBX読み込み失敗';
    errEl.textContent=String(err&&err.message||err||'unknown error')+"\n\n同じフォルダに Migi_straight.fbx があるか確認してください。";
  }
);

const clock=new THREE.Clock();
function resize(){
  const w=Math.max(1,mount.clientWidth||innerWidth);
  const h=Math.max(1,mount.clientHeight||innerHeight);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize,{passive:true});
addEventListener('orientationchange',()=>setTimeout(resize,150),{passive:true});
resize();

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer)mixer.update(dt);
  if(model)model.updateMatrixWorld(true);
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
